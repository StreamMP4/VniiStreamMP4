<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Imageboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 4chan Yotsuba B Theme Palette & Minimal Retro Styling */
    body {
      background-color: #d1d5ee;
      color: #800000;
      font-family: arial, helvetica, sans-serif;
      margin: 0;
      padding: 12px;
    }

    /* 4chan Post Card Frame */
    .chan-card {
      background-color: #f0e0d6;
      border: 1px solid #d9bfb7;
      border-right: 2px solid #b7c5d9;
      border-bottom: 2px solid #b7c5d9;
      border-radius: 0px !important;
      padding: 6px;
    }

    .chan-card:hover {
      border-color: #800000;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }
    ::-webkit-scrollbar-track {
      background: #d1d5ee;
    }
    ::-webkit-scrollbar-thumb {
      background: #b7c5d9;
      border: 1px solid #800000;
    }
  </style>
</head>

<body class="min-h-screen overflow-x-hidden">

  <!-- BACKGROUND AUDIO PLAYER -->
  <audio id="bgAudio" loop preload="auto">
    <source src="https://raw.githubusercontent.com/StreamMP4/VniiStreamMP4/main/Jhoom%20Rb%20Mix%20Ali%20Zafar%20128%20Kbps.mp3" type="audio/mpeg">
  </audio>

  <!-- AUDIO CONTROLLER BANNER -->
  <div class="mb-4 p-2 bg-[#f0e0d6] border border-[#800000] flex justify-between items-center text-xs font-mono">
    <span>♫ Playing: Jhoom (Rb Mix) - Ali Zafar</span>
    <button id="audioToggleBtn" class="bg-[#e0c0b7] hover:bg-[#800000] hover:text-white px-2 py-0.5 border border-[#800000] cursor-pointer">
      [ MUTE ]
    </button>
  </div>

  <!-- MEDIA BOARD GRID -->
  <div id="mediaGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3">
    <!-- Dynamic Content -->
  </div>

  <!-- ULTRA-MINIMAL RETRO LIGHTBOX MODAL -->
  <div id="mediaModal" class="fixed inset-0 z-50 hidden bg-[#d1d5ee]/90 backdrop-blur-sm flex items-center justify-center p-2 sm:p-6">
    <div class="relative bg-[#f0e0d6] border-2 border-[#800000] p-2 max-w-5xl max-h-[90vh] flex flex-col shadow-2xl">
      <!-- Modal Header Action Bar -->
      <div class="flex justify-between items-center mb-1">
        <button id="modalShareBtn" class="bg-[#e0c0b7] hover:bg-[#800000] hover:text-white text-[#800000] font-mono text-xs px-2 py-0.5 border border-[#800000] cursor-pointer">
          [ SHARE ]
        </button>
        <button id="modalCloseBtn" class="bg-[#e0c0b7] hover:bg-[#800000] hover:text-white text-[#800000] font-mono text-xs px-2 py-0.5 border border-[#800000] cursor-pointer">
          [ X ]
        </button>
      </div>

      <!-- Content Display -->
      <div class="relative flex items-center justify-center overflow-hidden bg-[#d1d5ee] border border-[#d9bfb7]">
        <!-- Video Player -->
        <video 
          id="modalVideo" 
          controls 
          class="hidden max-h-[80vh] w-auto max-w-full outline-none"
        ></video>

        <!-- Image Display -->
        <div id="modalImageWrapper" class="hidden relative">
          <img 
            id="modalImage" 
            src="" 
            alt="" 
            class="max-h-[80vh] w-auto max-w-full object-contain"
          />
        </div>
      </div>
    </div>
  </div>

  <!-- APPLICATION SCRIPT LOGIC -->
  <script>
    const REPO_USER = 'StreamMP4';
    const REPO_NAME = 'VniiStreamMP4';
    const GITHUB_API_URL = `https://api.github.com/repos/${REPO_USER}/${REPO_NAME}/contents`;

    let mediaItems = [];
    let activeModalItem = null;

    // Background Audio Handler
    const bgAudio = document.getElementById('bgAudio');
    const audioToggleBtn = document.getElementById('audioToggleBtn');

    function initAudio() {
      bgAudio.volume = 0.5;
      const playPromise = bgAudio.play();

      if (playPromise !== undefined) {
        playPromise.catch(() => {
          // If browser blocks autoplay, start on first user interaction
          const startAudioOnInteraction = () => {
            bgAudio.play();
            document.removeEventListener('click', startAudioOnInteraction);
            document.removeEventListener('keydown', startAudioOnInteraction);
          };
          document.addEventListener('click', startAudioOnInteraction);
          document.addEventListener('keydown', startAudioOnInteraction);
        });
      }

      audioToggleBtn.addEventListener('click', () => {
        if (bgAudio.paused) {
          bgAudio.play();
          audioToggleBtn.textContent = '[ MUTE ]';
        } else {
          bgAudio.pause();
          audioToggleBtn.textContent = '[ UNMUTE ]';
        }
      });
    }

    // Share Link Utility
    function shareMedia(url) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(url).then(() => {
          alert('Link copied to clipboard!');
        }).catch(() => {
          prompt('Copy media link:', url);
        });
      } else {
        prompt('Copy media link:', url);
      }
    }

    // Fetch Repository Contents Only
    async function fetchRepoMedia() {
      const grid = document.getElementById('mediaGrid');
      try {
        const response = await fetch(GITHUB_API_URL);
        if (!response.ok) throw new Error('Failed to load GitHub repository contents.');
        
        const data = await response.json();

        if (Array.isArray(data) && data.length > 0) {
          mediaItems = data.map(file => {
            if (file.type !== 'file') return null;
            // Ignore the audio track from grid rendering
            if (file.name.includes('Jhoom')) return null;

            const ext = file.name.split('.').pop().toLowerCase();
            const isVid = ['mp4', 'webm', 'ogg', 'mov', 'm4v'].includes(ext);
            const isImg = ['png', 'jpg', 'jpeg', 'webp', 'gif', 'svg'].includes(ext);

            if (isVid || isImg) {
              return {
                type: isVid ? 'video' : 'image',
                download_url: file.download_url || file.html_url
              };
            }
            return null;
          }).filter(Boolean);

          if (mediaItems.length === 0) {
            grid.innerHTML = `<div class="col-span-full text-center text-[#800000] font-mono py-10">No images or videos found in the repository.</div>`;
            return;
          }
          renderGrid();
        } else {
          grid.innerHTML = `<div class="col-span-full text-center text-[#800000] font-mono py-10">Repository is empty.</div>`;
        }
      } catch (err) {
        grid.innerHTML = `<div class="col-span-full text-center text-[#800000] font-mono py-10">Error loading media from GitHub repository.</div>`;
      }
    }

    // Render Grid
    function renderGrid() {
      const grid = document.getElementById('mediaGrid');
      grid.innerHTML = '';

      mediaItems.forEach(item => {
        const card = document.createElement('div');
        card.className = "chan-card relative flex flex-col justify-between aspect-square bg-[#d1d5ee]";

        const isVid = item.type === 'video';

        card.innerHTML = `
          <div class="relative w-full h-[82%] flex items-center justify-center overflow-hidden cursor-pointer media-click-area">
            ${isVid ? `
              <video 
                src="${item.download_url}#t=0.1" 
                muted
                preload="metadata"
                class="w-full h-full object-cover"
              ></video>
              <div class="absolute inset-0 bg-[#800000]/10 flex items-center justify-center pointer-events-none">
                <div class="w-8 h-8 bg-[#800000] text-white flex items-center justify-center border border-white text-xs">
                  ▶
                </div>
              </div>
            ` : `
              <img 
                src="${item.download_url}" 
                alt="" 
                class="w-full h-full object-cover"
              />
            `}
          </div>
          <div class="flex justify-between items-center pt-1 border-t border-[#d9bfb7] text-[10px] font-mono">
            <span>${item.type.toUpperCase()}</span>
            <button class="share-btn bg-[#e0c0b7] hover:bg-[#800000] hover:text-white px-1 py-0.5 border border-[#800000] cursor-pointer">
              [ SHARE ]
            </button>
          </div>
        `;

        card.querySelector('.media-click-area').addEventListener('click', () => openModal(item));
        card.querySelector('.share-btn').addEventListener('click', (e) => {
          e.stopPropagation();
          shareMedia(item.download_url);
        });

        grid.appendChild(card);
      });
    }

    // Modal Control
    const modal = document.getElementById('mediaModal');
    const modalVideo = document.getElementById('modalVideo');
    const modalImageWrapper = document.getElementById('modalImageWrapper');
    const modalImage = document.getElementById('modalImage');
    const modalCloseBtn = document.getElementById('modalCloseBtn');
    const modalShareBtn = document.getElementById('modalShareBtn');

    function openModal(item) {
      activeModalItem = item;
      if (item.type === 'video') {
        modalImageWrapper.classList.add('hidden');
        modalVideo.classList.remove('hidden');
        modalVideo.src = item.download_url;
        modalVideo.play().catch(() => {});
      } else {
        modalVideo.classList.add('hidden');
        modalImageWrapper.classList.remove('hidden');
        modalImage.src = item.download_url;
      }
      modal.classList.remove('hidden');
    }

    function closeModal() {
      modal.classList.add('hidden');
      modalVideo.pause();
      modalVideo.src = "";
      modalImage.src = "";
      activeModalItem = null;
    }

    modalShareBtn.addEventListener('click', () => {
      if (activeModalItem) shareMedia(activeModalItem.download_url);
    });

    modalCloseBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    window.onload = function() {
      initAudio();
      fetchRepoMedia();
    };
  </script>
</body>
</html>
